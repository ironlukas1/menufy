services:
  menufy-api:
    build: ./backend
    container_name: menufy-api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${MENUFY_CORS_ORIGINS:-capacitor://localhost,ionic://localhost}
    networks:
      - homelab

  menufy:
    image: nginx:alpine
    container_name: menufy
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 50
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - menufy-api
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.menufy.rule=Host(`menufy.misaligned.dev`)"
      - "traefik.http.routers.menufy.entrypoints=websecure"
      - "traefik.http.routers.menufy.tls.certresolver=letsencrypt"
      - "traefik.http.services.menufy.loadbalancer.server.port=80"

networks:
  homelab:
    external: true
