<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Denné menu reštaurácií vo vašom okolí – menufy" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>menufy – denné menu vo vašom okolí</title>
    <script>
      try {
        var t = localStorage.getItem("menufy-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
