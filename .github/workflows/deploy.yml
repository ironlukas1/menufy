name: Deploy to max

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Guard client-exposed secret names
        # Inspect only the names referenced by checked-in workflows. Secret
        # values are never serialised into a script. VITE_*/NEXT_PUBLIC_*
        # variables end up in the browser bundle, so they must not hold secrets.
        # Publishable (RLS-safe) keys are the only documented exception.
        run: |
          set -euo pipefail
          offenders=$(
            git grep -nE 'secrets\.(VITE_|NEXT_PUBLIC_)[A-Z0-9_]*(SECRET|SERVICE|TOKEN|PASSWORD|KEY)' -- .github/workflows \
              | grep -v 'PUBLISHABLE_KEY' || true
          )
          if [ -n "$offenders" ]; then
            echo '::error::Client-exposed secret names must not contain SECRET/SERVICE/TOKEN/PASSWORD/KEY'
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo 'Checked workflow secret references; no client-exposed sensitive names found.'

      - name: Test and build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Stage release
        run: |
          set -euo pipefail
          mkdir stage
          cp -r app/dist stage/site
          rsync -a --exclude=node_modules --exclude=.next --exclude='.env*' backend/ stage/backend/
          cp deploy/docker-compose.yml deploy/nginx.conf stage/
          if grep -RIEq 'sb_secret_[A-Za-z0-9_-]{20,}|service_role|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' stage/site; then
            echo '::error::Secret-shaped value found in the staged browser bundle'
            exit 1
          fi

      - name: Ship to max
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts > /dev/null
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no entry for $DEPLOY_HOST"
            exit 1
          fi
          tar -C stage -c . | ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Check site
        run: |
          set -euo pipefail
          url=https://menufy.misaligned.dev
          html=$(mktemp)
          status=$(curl -fsS --retry 5 --retry-connrefused --retry-delay 3 -o "$html" -w '%{http_code}' "$url/")
          test "$status" = "200"
          grep -q '<div id="root"></div>' "$html"
          headers=$(curl -fsSI "$url/")
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^referrer-policy: ' <<<"$headers"
          grep -Fi 'frame-ancestors https://space.misaligned.dev' <<<"$headers"
          api_headers=$(curl -sS -D - -o /dev/null "$url/api/v1/health" || true)
          grep -Fi "frame-ancestors 'none'" <<<"$api_headers"
          api_status=$(curl -sS --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' "$url/api/v1/health" || true)
          echo "API /api/v1/health HTTP status: ${api_status:-none}"
          echo "Deployment verification passed"
